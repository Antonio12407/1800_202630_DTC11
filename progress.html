<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quaggle | Your Progress</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Color CSS stylesheet -->
  <link href="styles/colors.css" rel="stylesheet" />
  <link href="styles/badges.css" rel="stylesheet" />
  <link href="styles/progress.css" rel="stylesheet" />

  <!-- Web Components for shared navbar and footer layout -->
  <script type="module" src="/src/components/site-navbar.js"></script>
</head>

<!-- Opens after Continue on the results screen: the updated daily streak
     and progress towards each badge. Filled in by src/progress.js. -->
<body class="page-centered">
  <site-navbar></site-navbar>

  <main class="page-content container px-3 py-2 text-center" style="max-width: 560px">
    <h1 class="fw-bolder text-body-emphasis">Your Progress</h1>

    <!-- Daily streak -->
    <div class="mt-4 p-4 border border-2 rounded-4 shadow-sm">
      <p class="mb-1 fs-5">Daily Streak</p>
      <p class="display-4 fw-bold mb-1 progress-streak">
        <i class="bi bi-fire" aria-hidden="true"></i>
        <span id="progress-streak">0</span>
        <span id="progress-streak-unit" class="fs-3">days</span>
      </p>
      <p id="progress-streak-note" class="mb-0 small text-secondary"></p>
    </div>

    <!-- Progress towards each badge -->
    <div class="mt-4 p-4 border border-2 rounded-4 shadow-sm">
      <p class="mb-3 fs-5">Badges</p>
      <ul id="progress-badges" class="list-unstyled mb-0 text-start">
        <li id="progress-status" class="text-center small text-secondary" role="status" aria-live="polite">
          Loading your progress...
        </li>
      </ul>
    </div>

    <a href="main.html" class="btn btn-outline-success btn-lg px-4 mt-4">Back to Home</a>
  </main>

  <script type="module" src="/src/progress.js"></script>
</body>

</html>
