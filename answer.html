<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review Answers</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="styles/colors.css" rel="stylesheet" />
  <link href="styles/answer.css" rel="stylesheet" />
</head>

<body>
  <main class="review-container">
    <header class="review-header">
      <h1>Want to review your answers?</h1>
    </header>

    <section class="review-content" aria-label="Your answers">
      <p class="mb-4">
        Click your answer to return to that question and change it.
      </p>

      <div class="review-row">
        <span class="question-label">Q1</span>
        <a href="quiz.html?question=1&amp;review=true" id="answer-one" class="btn review-answer">
          Not answered
        </a>
      </div>

      <div class="review-row">
        <span class="question-label">Q2</span>
        <a href="quiz.html?question=2&amp;review=true" id="answer-two" class="btn review-answer">
          Not answered
        </a>
      </div>

      <div class="review-row">
        <span class="question-label">Q3</span>
        <a href="quiz.html?question=3&amp;review=true" id="answer-three" class="btn review-answer">
          Not answered
        </a>
      </div>

      <button type="button" id="submit-button" class="btn submit-button w-100 mt-2">
        Submit
      </button>

      <p id="submit-message" class="text-center mt-3 mb-0" role="status"></p>
    </section>
  </main>

  <script type="module">
    import { onAuthReady } from "/src/authentication.js";
    import { recordQuizCompletion } from "/src/streak.js";

    // The streak is saved per user, so remember who is logged in.
    let currentUser = null;
    onAuthReady(function (user) {
      currentUser = user;
    });

    function displayAnswers() {
      document.getElementById("answer-one").textContent =
        sessionStorage.getItem("question1Answer") || "Not answered";

      document.getElementById("answer-two").textContent =
        sessionStorage.getItem("question2Answer") || "Not answered";

      document.getElementById("answer-three").textContent =
        sessionStorage.getItem("question3Answer") || "Not answered";
    }

    window.addEventListener("pageshow", displayAnswers);

    document
      .getElementById("submit-button")
      .addEventListener("click", async function () {
        const submitButton = this;
        const message = document.getElementById("submit-message");
        const answer1 = sessionStorage.getItem("question1Answer");
        const answer2 = sessionStorage.getItem("question2Answer");
        const answer3 = sessionStorage.getItem("question3Answer");

        if (!answer1 || !answer2 || !answer3) {
          message.textContent =
            "Please answer all three questions before submitting.";
          return;
        }

        if (!currentUser) {
          message.textContent = "Please log in to save your streak.";
          return;
        }

        submitButton.disabled = true; // prevent double clicks
        message.textContent = "Saving...";

        try {
          // Quiz is complete: increase the streak in Firestore
          // (only once per day; recordQuizCompletion handles that).
          await recordQuizCompletion(currentUser);
          sessionStorage.setItem("quaggle_completed_today", "true");
          window.location.href = "results.html";
        } catch (error) {
          console.error("Could not save quiz completion:", error);
          message.textContent = "Could not save your progress. Please try again.";
          submitButton.disabled = false;
        }
      });
  </script>
</body>

</html>
