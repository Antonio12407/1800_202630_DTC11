<!doctype html>
<html lang="en">
  <head>
    <title>Quaggle Quiz History</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="styles/colors.css" rel="stylesheet" />
    <link href="styles/history.css" rel="stylesheet" />
    <script type="module" src="/src/components/site-navbar.js"></script>
    

  </head>

  <body>
    <site-navbar></site-navbar>

    <main class="container history-container px-0 my-4 shadow-sm">
      <section class="history-header">
        <h1>Quiz History</h1>
      </section>

      <section class="history-content" aria-live="polite">
        <p id="history-status">Loading your history...</p>
        <ol id="history-list"></ol>
        <div class="text-center mt-3">
          <a id="start-link" href="quiz.html" class="btn d-none">Start today's quiz</a>
        </div>
      </section>
    </main>

    <script type="module" src="/src/history.js"></script>
  </body>
</html>
