<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quaggle | Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="styles/colors.css" rel="stylesheet" />
    <script type="module" src="/src/components/site-navbar.js"></script>
  </head>

  <body class="pb-5 mb-5">
    <site-navbar></site-navbar>

    <div class="d-none d-md-block py-5"></div>

    <main class="container px-3 pt-4 pb-5" style="max-width: 560px">
      <h1 class="fw-bolder text-body-emphasis text-center">Settings</h1>
      <h2 class="h4 text-center mt-3">Edit profile</h2>

      <!-- Change username -->
      <form id="name-form" class="mt-4 p-4 border border-2 rounded-4 shadow-sm">
        <label for="name-input" class="form-label fw-bold">Username</label>
        <input type="text" id="name-input" class="form-control mb-3" required />
        <button type="submit" class="btn btn-outline-success w-100">Save username</button>
        <p id="name-status" class="mt-3 mb-0 small" role="status"></p>
      </form>

      <!-- Change email -->
      <form id="email-form" class="mt-4 p-4 border border-2 rounded-4 shadow-sm">
        <label for="email-input" class="form-label fw-bold">Email</label>
        <input type="email" id="email-input" class="form-control mb-3" required />

        <label for="password-input" class="form-label fw-bold">Current password</label>
        <input type="password" id="password-input" class="form-control mb-3" required />

        <button type="submit" class="btn btn-outline-success w-100">Save email</button>
        <p id="email-status" class="mt-3 mb-0 small" role="status"></p>
      </form>
    </main>

    <script type="module" src="/src/settings.js"></script>
  </body>
</html>
