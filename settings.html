<!doctype html>
<html lang="en">
  <head>
    <title>Quaggle</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Google fonts API -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap"
      rel="stylesheet" />

    <!-- Color CSS stylesheet -->
    <link href="styles/colors.css" rel="stylesheet" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>


    <!-- Browser tab icon -->
    <link rel="icon" type="image/png" href="/images/tablogo.png" />
  </head>

  <body class="page-centered">
    <site-navbar></site-navbar>

    <main class="page-content container px-3 py-2" style="max-width: 560px">
      <h1 class="fw-bolder text-body-emphasis text-center">Settings</h1>
      <h2 class="h4 text-center mt-3">Edit profile</h2>

      <!-- Profile form: the field is locked until Edit is clicked -->
      <form id="profileForm" class="mt-4 p-4 border border-2 rounded-4 shadow-sm">
        <div id="profileAlert" class="alert d-none" role="status"></div>

        <label for="nameInput" class="form-label fw-bold">Username</label>
        <input type="text" id="nameInput" class="form-control mb-3" disabled />

        <div class="d-flex gap-2">
          <button type="button" id="editBtn" class="btn btn-outline-success w-100">Edit</button>
          <button type="submit" id="saveBtn" class="btn btn-outline-success w-100" disabled>Save</button>
        </div>
      </form>

      <!-- Log out (moved here from the navbar) -->
      <div class="text-center">
        <button type="button" id="logout-button" class="btn btn-outline-success btn-lg px-4 mt-5">
          <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Log out
        </button>
        <p id="logout-status" class="mt-2 mb-0 small" role="status" aria-live="polite"></p>
      </div>
    </main>

    <script type="module" src="/src/settings.js"></script>
  </body>
</html>
