<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quaggle Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles/colors.css" rel="stylesheet">
    <link href="styles/results.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body>

    <main class="results-container">

        <header class="results-header">
            <h1>Quiz Complete!</h1>
            <p>Here are your results.</p>
        </header>

        <section class="results-content">

            <div class="results-summary">

                <div class="results-card">
                    <h2 id="score">Loading...</h2>
                    <p>Correct Answers</p>
                </div>

                <div class="results-card">
                    <h2 id="total">Loading...</h2>
                    <p>Total Questions</p>
                </div>

                <div class="results-card">
                    <h2 id="percentage">Loading...</h2>
                    <p>Percentage Score</p>
                </div>

            </div>

            <p id="status"></p>

            <!-- Copies the score to the clipboard (src/shareResults.js) -->
            <button type="button" id="share-score" class="back-button mb-2" disabled>
                <i class="fa-solid fa-share me-2" aria-hidden="true"></i>Share my score
            </button>

            <a href="history.html" class="back-button mb-2">View Quiz History</a>
            <a href="main.html" class="back-button">
                Back to Home
            </a>

        </section>

    </main>

    <!-- SweetAlert2 popup library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="/src/results.js"></script>
    <script type="module" src="/src/saveHistory.js"></script>
    <script type="module" src="/src/shareResults.js"></script>

</body>

</html>
