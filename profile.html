<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quaggle | Profile</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Google fonts API -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap"
    rel="stylesheet" />

  <!-- Color CSS stylesheet -->
  <link href="styles/colors.css" rel="stylesheet" />
  <link href="styles/badges.css" rel="stylesheet" />

  <!-- Web Components for shared navbar and footer layout -->
  <script type="module" src="/src/components/site-navbar.js"></script>
</head>

<body class="pb-5 mb-5">
  <site-navbar></site-navbar>

  <div class="d-none d-md-block py-5"></div>

  <main class="container px-3 pt-4 pb-5 text-center" style="max-width: 560px">
    <h1 class="fw-bolder text-body-emphasis">Your Profile</h1>

    <!-- Name and email -->
    <div class="mt-4 p-4 border border-2 rounded-4 shadow-sm d-flex justify-content-around align-items-center">
      <div>
        <i class="bi bi-person-circle display-3" aria-hidden="true" style="color: #6b4226"></i>
        <h2 id="profile-name" class="h3 fw-bold mt-2 mb-1">Loading...</h2>
        <p id="profile-email" class="mb-0 text-secondary"></p>
      </div>
      <div class="">
        <p class="mb-1 fs-5">Quizzes Completed</p>
        <p class="display-4 fw-bold mb-0" style="color: #6b4226">
          <i class="bi bi-check2-circle" aria-hidden="true"></i>
          <span id="profile-quiz-count">0</span>
        </p>
      </div>
    </div>

    <!-- Current streak + share -->
    <div class="mt-4 p-4 border border-2 rounded-4 shadow-sm">
      <p class="mb-1 fs-5">Current Streak</p>
      <p class="display-4 fw-bold mb-3" style="color: #6b4226">
        <i class="bi bi-fire" aria-hidden="true"></i>
        <span id="profile-streak">0</span>
        <span id="profile-streak-unit" class="fs-3">days</span>
      </p>

      <button type="button" id="share-streak" class="btn btn-outline-success btn-lg px-4" disabled>
        <i class="bi bi-share me-2" aria-hidden="true"></i>Share my streak
      </button>

    </div>

    <!-- Quizzes completed (counted from the user's quiz history) -->


    <!-- Badges -->
    <div class="mt-4 p-4 border border-2 rounded-4 shadow-sm">
      <p class="mb-3 fs-5">Badges</p>
      <div id="badge-list" class="row g-2 justify-content-center">
        <p id="badge-status" class="mb-0 small text-secondary" role="status" aria-live="polite">
          Loading badges...
        </p>
      </div>
    </div>

    <!-- Link to the user's quiz history -->
    <a href="history.html" class="btn btn-outline-success btn-lg px-4 mt-4">Quiz History</a>

    <!-- Log out (moved here from the navbar) -->
    <button type="button" id="logout-button" class="btn btn-outline-secondary btn-lg px-4 mt-4">
      <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Log out
    </button>
    <p id="logout-status" class="mt-2 mb-0 small" role="status" aria-live="polite"></p>
  </main>

  <!-- SweetAlert2 popup library -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module" src="/src/profile.js"></script>

</body>

</html>
