<!doctype html>
<html lang="en">
  <head>
    <title>Quaggle Quiz</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap"
      rel="stylesheet"
    />

    <link href="styles/colors.css" rel="stylesheet" />
    <link href="styles/quiz.css" rel="stylesheet" />

    <script type="module" src="/src/components/site-navbar.js"></script>
  </head>

  <body class="bg-light">
    <main class="container quiz-container px-0 my-4 shadow-sm">
      <section class="question-container p-3" aria-labelledby="question-title">
        <h1 id="question-title" class="mb-3">Question 1</h1>

        <p id="question-source" class="text-break"></p>

        <div class="clearfix">
          <div
            class="image-placeholder"
            role="img"
            aria-label="Placeholder image"
          ></div>

          <p id="question-description"></p>

          <p id="question-prompt" class="mb-0"></p>
        </div>
      </section>

      <section class="bg-white p-3" aria-label="Answer choices">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <button
              type="button"
              class="btn answer-button w-100 h-100"
            ></button>
          </div>

          <div class="col-12 col-md-6">
            <button
              type="button"
              class="btn answer-button w-100 h-100"
            ></button>
          </div>

          <div class="col-12 col-md-6">
            <button
              type="button"
              class="btn answer-button w-100 h-100"
            ></button>
          </div>

          <div class="col-12 col-md-6">
            <button
              type="button"
              class="btn answer-button w-100 h-100"
            ></button>
          </div>
        </div>
        <p id="progress-label" class="small text-secondary mt-4 mb-2">
          Question 1 of 3
        </p>

        <div
          id="quiz-progress"
          class="progress"
          role="progressbar"
          aria-label="Quiz progress"
          aria-valuenow="33"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div
            id="progress-bar"
            class="progress-bar bg-secondary"
            style="width: 33%"
          >
            33%
          </div>
        </div>
      </section>
    </main>

    <script>
      const questions = [
        {
          source: "Source: Sample article 1",
          description:
            "An online article makes a surprising claim, but it does not name its author or provide evidence.",
          prompt: "What should you do before sharing this article?",
          answers: [
            "A. Share it immediately",
            "B. Check other reliable sources",
            "C. Trust the headline",
            "D. Read only the comments",
          ],
        },
        {
          source: "Source: Sample article 2",
          description:
            "A social media post uses an old photograph to describe an event happening today.",
          prompt: "What is the best way to check the photograph?",
          answers: [
            "A. Check its original date and source",
            "B. Count the likes",
            "C. Trust whoever posted it",
            "D. Share it with friends",
          ],
        },
        {
          source: "Source: Sample article 3",
          description:
            "Two websites report different information about the same event.",
          prompt:
            "What should you compare to decide which information is more trustworthy?",
          answers: [
            "A. Their background colours",
            "B. Their number of advertisements",
            "C. Their evidence, authors, and dates",
            "D. Their headline sizes",
          ],
        },
      ];

      const parameters = new URLSearchParams(window.location.search);
      let questionNumber = Number(parameters.get("question")) || 1;

      if (![1, 2, 3].includes(questionNumber)) {
        questionNumber = 1;
      }

      const question = questions[questionNumber - 1];
      const storageKey = "question" + questionNumber + "Answer";
      const answerButtons = document.querySelectorAll(".answer-button");

      document.getElementById("question-title").textContent =
        "Question " + questionNumber;

      document.getElementById("question-source").textContent = question.source;

      document.getElementById("question-description").textContent =
        question.description;

      document.getElementById("question-prompt").textContent = question.prompt;

      const percentage = Math.round((questionNumber / 3) * 100);

      document.getElementById("progress-label").textContent =
        "Question " + questionNumber + " of 3";

      document
        .getElementById("quiz-progress")
        .setAttribute("aria-valuenow", percentage);

      const progressBar = document.getElementById("progress-bar");

      progressBar.style.width = percentage + "%";
      progressBar.textContent = percentage + "%";

      function restoreSelection() {
        const savedAnswer = sessionStorage.getItem(storageKey);

        answerButtons.forEach(function (button) {
          const selected = button.textContent.trim() === savedAnswer;

          button.setAttribute("aria-pressed", String(selected));
          button.style.outline = selected ? "3px solid #8A5A3A" : "";
          button.style.outlineOffset = selected ? "3px" : "";
        });
      }

      answerButtons.forEach(function (button, index) {
        button.textContent = question.answers[index];

        button.addEventListener("click", function () {
          sessionStorage.setItem(storageKey, button.textContent.trim());

          if (parameters.get("review") === "true") {
            window.location.href = "answer.html";
          } else if (questionNumber < questions.length) {
            window.location.href = "quiz.html?question=" + (questionNumber + 1);
          } else {
            sessionStorage.setItem("quaggle_completed_today", "true");
            window.location.href = "answer.html";
          }
        });
      });

      restoreSelection();
      window.addEventListener("pageshow", restoreSelection);
    </script>
  </body>
</html>
