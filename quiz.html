<!doctype html>
<html lang="en">

<head>
  <title>Quaggle Quiz</title>
  <meta name="comp1800 template" content="My 1800 App" />

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap"
    rel="stylesheet" />

  <link href="styles/colors.css" rel="stylesheet" />
  <link href="styles/quiz.css" rel="stylesheet" />

  <script type="module" src="/src/components/site-navbar.js"></script>
</head>

<body>
  <site-navbar></site-navbar>

  <main class="container quiz-container px-0 my-4 shadow-sm">

    <section class="question-container" aria-labelledby="question-title">

      <!-- Progress Bar -->
      <p id="progress-label" class="d-none small text-secondary mb-2">
        Loading...
      </p>

      <div id="quiz-progress" class="progress mb-4" role="progressbar" aria-label="Quiz progress" aria-valuenow="0"
        aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress-bar bg-secondary" style="width: 0%"></div>
      </div>

      <!-- Question heading and zoom controls -->
      <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
        <h1 id="question-title" class="mb-0">Loading question...</h1>

        <div class="quiz-zoom-controls d-flex align-items-center gap-2">
          <button type="button" id="zoom-out-btn" class="btn quiz-zoom-btn" aria-label="Smaller text">
            <i class="bi bi-dash-lg" aria-hidden="true"></i>
          </button>

          <span id="zoom-label" class="quiz-zoom-label text-center" aria-live="polite">
            100%
          </span>

          <button type="button" id="zoom-in-btn" class="btn quiz-zoom-btn" aria-label="Larger text">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <p id="question-source" class="text-break"></p>

      <div class="clearfix">
        <!-- Only shown when a question has an image -->
        <div class="image-placeholder" role="img" aria-label="Question image" hidden></div>

        <p id="question-description"></p>

        <p id="question-prompt" class="mb-0"></p>
      </div>

    </section>

    <!-- Answer choices -->
    <section class="answer-choices" aria-label="Answer choices">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <button type="button" class="btn answer-button w-100 h-100"></button>
        </div>

        <div class="col-12 col-md-6">
          <button type="button" class="btn answer-button w-100 h-100"></button>
        </div>

        <div class="col-12 col-md-6">
          <button type="button" class="btn answer-button w-100 h-100"></button>
        </div>

        <div class="col-12 col-md-6">
          <button type="button" class="btn answer-button w-100 h-100"></button>
        </div>
      </div>
    </section>

  </main>

  <!-- SweetAlert2 popup library (answer breakdown after each question) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module" src="./src/quiz.js"></script>
  <script type="module" src="./src/quizProgress.js"></script>
  <script type="module" src="./src/zoomTool.js"></script>
</body>

</html>
