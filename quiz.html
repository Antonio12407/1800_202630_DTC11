<!doctype html>
<html lang="en">

<head>
  <title>Quaggle Quiz</title>
  <meta name="comp1800 template" content="My 1800 App" />

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap"
    rel="stylesheet" />

  <link href="styles/colors.css" rel="stylesheet" />
  <link href="styles/quiz.css" rel="stylesheet" />

    <script type="module" src="/src/components/site-navbar.js"></script>
  </head>

<body class="bg-light">
  <main class="container quiz-container px-0 my-4 shadow-sm">
    <section class="question-container p-3" aria-labelledby="question-title">
      <h1 id="question-title" class="mb-3">Loading question...</h1>

      <p id="question-source" class="text-break"></p>

      <div class="clearfix">
        <div class="image-placeholder" role="img" aria-label="Placeholder image"></div>

        <p id="question-description"></p>

        <p id="question-prompt" class="mb-0"></p>
      </div>
    </section>

    <section class="bg-white p-3" aria-label="Answer choices">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <button type="button" class="btn answer-button w-100 h-100"></button>
        </div>

        <div class="col-12 col-md-6">
          <button type="button" class="btn answer-button w-100 h-100"></button>
        </div>

        <div class="col-12 col-md-6">
          <button type="button" class="btn answer-button w-100 h-100"></button>
        </div>

        <div class="col-12 col-md-6">
          <button type="button" class="btn answer-button w-100 h-100"></button>
        </div>
      </div>

      <p id="progress-label" class="small text-secondary mt-4 mb-2">
        Loading...
      </p>

      <div id="quiz-progress" class="progress" role="progressbar" aria-label="Quiz progress" aria-valuenow="0"
        aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress-bar bg-secondary" style="width: 0%"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/quiz.js"></script>
</body>

</html>
